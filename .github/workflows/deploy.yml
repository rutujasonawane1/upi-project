name: Deploy FlexiPay to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Merchant POS Terminal
        run: |
          cd FlexiPay-Merchant-Clean/flexipay-merchant
          npm install
          npm run build

      - name: Build Consumer UPI App
        run: |
          cd UPI-FlexiPay-Clean/upi-clean
          npm install
          npm run build

      - name: Assemble GitHub Pages Distribution
        run: |
          mkdir -p dist-site/merchant dist-site/consumer
          cp -r FlexiPay-Merchant-Clean/flexipay-merchant/dist/* dist-site/merchant/
          cp -r UPI-FlexiPay-Clean/upi-clean/dist/* dist-site/consumer/
          cp landing.html dist-site/index.html
          touch dist-site/.nojekyll

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-site
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
